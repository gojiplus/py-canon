[project]
name = "py-canon"
description = "Shared configuration and standards for the fleet's Python packages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
requires-python = ">=3.11"
version = "1.0.0"
keywords = ["template", "standards", "sphinx", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gojiplus/py-canon"
Repository = "https://github.com/gojiplus/py-canon"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "pyright>=1.1.390",
    { include-group = "test" },
]
test = ["pytest>=8", "sphinx>=8", "furo", "myst-parser", "sphinx-copybutton"]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention this standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`,
# which the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
"tests/**" = ["S101", "D", "ARG", "SLF"]
# Operator CLI scripts: printing is the interface, and shelling out to `gh` on
# PATH is the point. Docstrings on their internal helpers are noise.
"tools/**" = ["T201", "S603", "S607", "D103"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.preen]
# Two checks are structurally impossible here rather than drift, which is
# exactly what skip_checks is for:
#
# template   preen looks for .copier-answers.yml to prove a repo was generated
#            from the template. This repo *is* the template's source; there is
#            nothing for it to be adopted from.
# ci-matrix  the check wants either a `@v1` shim or an explicit matrix testing
#            the requires-python floor. ci.yml here calls
#            ./.github/workflows/reusable-ci.yml on purpose, so a pull request
#            tests the workflow under change rather than the released v1 -- and
#            that workflow does test the floor. The check does not recognize
#            the local-path form yet.
skip_checks = ["template", "ci-matrix"]
