version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain guard: only propose releases that are at least a week old.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The scaffolding copied into each new repo pins third-party actions by SHA
  # of its own, and "/" does not reach it -- Dependabot resolves the ecosystem
  # relative to each directory it is given. Without this entry those pins are
  # frozen at whatever was current the day the template was written, and every
  # repo generated afterwards inherits them. The .jinja siblings need no entry:
  # they reference only this repo's reusable workflows.
  - package-ecosystem: "github-actions"
    directory: "/template"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      template-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
