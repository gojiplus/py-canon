name: Dependabot auto-merge

# All the logic lives in py-canon, so a fix there reaches this repo on its
# next run instead of waiting for someone to copy a file across.

on:
  pull_request:
  schedule:
    # Every three hours, offset off the hour so it does not queue behind the
    # crowd of on-the-hour jobs.
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auto-merge:
    permissions:
      contents: write        # arm auto-merge, or squash-merge outright
      pull-requests: write   # label, comment, merge
    # Self-reference by path, not @v1: this repo defines the workflow, so it
    # must run the version on the branch under review rather than whatever
    # the moving tag currently points at -- which on a PR adding it is a tag
    # that does not have it yet.
    uses: ./.github/workflows/reusable-dependabot-auto-merge.yml
