name: Reusable Release

on:
  workflow_call:
    inputs:
      publish-pypi:
        # PyPI trusted publishing does NOT support reusable workflows —
        # the OIDC claims reference this file, not the caller's. Leave
        # this false and put the publish job in the caller's release.yml
        # (the template ships it); this job remains for token-based or
        # future use.
        description: 'Publish to (Test)PyPI from this reusable workflow'
        type: boolean
        default: false
      testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        default: false
      github-release:
        description: 'Create a GitHub Release with generated notes'
        type: boolean
        default: true
      run-tests:
        # A PyPI upload cannot be withdrawn, so the suite runs against the
        # exact commit being published rather than trusting that CI saw it.
        # It usually did -- but "usually" is doing real work in that sentence:
        # a tag can point at a commit pushed straight to the default branch, at
        # an older commit, or at one whose CI run was cancelled, and none of
        # those look any different from here.
        #
        # Costs one test run per release, which happens a few times a year.
        description: 'Run the test suite before building (strongly recommended)'
        type: boolean
        default: true
      test-python-version:
        # Empty means "let uv choose", which is the only default that cannot be
        # wrong. A fixed version here was wrong for every project whose floor
        # was above it: uv could not resolve an interpreter, `test` died at
        # Sync environment, and because build/publish/github-release all sit
        # behind `test` they *skipped*. The visible symptom was a missing
        # GitHub Release rather than a version error, which is what made it
        # survive a real release (indicate v0.8.0).
        #
        # uv reads `requires-python` and downloads a matching interpreter if
        # the runner has none (`python-downloads` defaults to `automatic`), so
        # there is nothing left for this input to get wrong.
        description: 'Pin the pre-release test run to one Python version (default: whatever satisfies requires-python)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    if: inputs.run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # setup-uv's `python-version` input only sets UV_PYTHON, and its handling
      # of an empty string is undocumented -- so set the variable directly, and
      # only when a caller actually asked for a pin.
      - name: Pin the interpreter, if the caller asked for one
        if: inputs.test-python-version != ''
        env:
          PINNED: ${{ inputs.test-python-version }}
        run: echo "UV_PYTHON=$PINNED" >> "$GITHUB_ENV"
      # Same sync as reusable-ci's test job, so a release runs what CI runs.
      - name: Sync environment
        run: |
          test_group=()
          if python -c 'import sys, tomllib; sys.exit("test" not in tomllib.load(open("pyproject.toml", "rb")).get("dependency-groups", {}))'; then
            test_group=(--group test)
          fi
          if [ -f uv.lock ]; then
            uv sync --no-default-groups --frozen --group dev "${test_group[@]}" --all-extras
          else
            uv sync --no-default-groups --group dev "${test_group[@]}" --all-extras
          fi
      # A release is the one action that cannot be taken back, so the log says
      # which interpreter the suite actually ran on rather than leaving it to
      # be inferred from the runner image.
      - name: Report the resolved interpreter
        run: uv run python -VV
      - name: Run tests
        run: uv run pytest

  build:
    needs: test
    # `needs` on a job that can be skipped would skip this one too, so state
    # the condition rather than inheriting it: build whenever the tests either
    # passed or were deliberately not run.
    if: >-
      !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # remove after the existing dynamic-version repos migrate
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build distributions
        run: uv build
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built_version=$(unzip -p dist/*.whl '*/METADATA' | sed -n 's/^Version: //p')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$built_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match built version $built_version"
            exit 1
          fi
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    if: inputs.publish-pypi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.testpypi && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write  # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          # Matches the template's publish step. This path is reachable only via
          # publish-pypi: true, which defaults false because trusted publishing
          # cannot bind its OIDC claims to a reusable workflow -- but leaving the
          # two publish steps saying different things is exactly how their action
          # pins came to be two months apart.
          skip-existing: true
          repository-url: ${{ inputs.testpypi && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    if: >-
      !cancelled() && inputs.github-release && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
