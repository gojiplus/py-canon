name: Reusable Release

on:
  workflow_call:
    inputs:
      publish-pypi:
        # PyPI trusted publishing does NOT support reusable workflows —
        # the OIDC claims reference this file, not the caller's. Leave
        # this false and put the publish job in the caller's release.yml
        # (the template ships it); this job remains for token-based or
        # future use.
        description: 'Publish to (Test)PyPI from this reusable workflow'
        type: boolean
        default: false
      testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        default: false
      github-release:
        description: 'Create a GitHub Release with generated notes'
        type: boolean
        default: true
      run-tests:
        # A PyPI upload cannot be withdrawn, so the suite runs against the
        # exact commit being published rather than trusting that CI saw it.
        # It usually did -- but "usually" is doing real work in that sentence:
        # a tag can point at a commit pushed straight to the default branch, at
        # an older commit, or at one whose CI run was cancelled, and none of
        # those look any different from here.
        #
        # Costs one test run per release, which happens a few times a year.
        description: 'Run the test suite before building (strongly recommended)'
        type: boolean
        default: true
      test-python-version:
        description: 'Python version for the pre-release test run'
        type: string
        default: '3.12'

permissions:
  contents: read

jobs:
  test:
    if: inputs.run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ inputs.test-python-version }}
      # Same sync as reusable-ci's test job, so a release runs what CI runs.
      - name: Sync environment
        run: |
          if [ -f uv.lock ]; then uv sync --frozen --all-groups --all-extras; else uv sync --all-groups --all-extras; fi
      - name: Run tests
        run: uv run pytest

  build:
    needs: test
    # `needs` on a job that can be skipped would skip this one too, so state
    # the condition rather than inheriting it: build whenever the tests either
    # passed or were deliberately not run.
    if: >-
      !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # dynamic versioning reads tags
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build distributions
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    if: inputs.publish-pypi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.testpypi && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write  # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          repository-url: ${{ inputs.testpypi && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    if: >-
      !cancelled() && inputs.github-release && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
