name: Reusable Release

on:
  workflow_call:
    inputs:
      publish-pypi:
        # PyPI trusted publishing does NOT support reusable workflows —
        # the OIDC claims reference this file, not the caller's. Leave
        # this false and put the publish job in the caller's release.yml
        # (the template ships it); this job remains for token-based or
        # future use.
        description: 'Publish to (Test)PyPI from this reusable workflow'
        type: boolean
        default: false
      testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        default: false
      github-release:
        description: 'Create a GitHub Release with generated notes'
        type: boolean
        default: true
      run-tests:
        # A PyPI upload cannot be withdrawn, so the suite runs against the
        # exact commit being published rather than trusting that CI saw it.
        # It usually did -- but "usually" is doing real work in that sentence:
        # a tag can point at a commit pushed straight to the default branch, at
        # an older commit, or at one whose CI run was canceled, and none of
        # those look any different from here.
        #
        # Costs one test run per release, which happens a few times a year.
        description: 'Run the test suite before building (strongly recommended)'
        type: boolean
        default: true
      test-python-version:
        # Empty means "let uv choose", which is the only default that cannot be
        # wrong. A fixed version here was wrong for every project whose floor
        # was above it: uv could not resolve an interpreter, `test` died at
        # Sync environment, and because build/publish/github-release all sit
        # behind `test` they *skipped*. The visible symptom was a missing
        # GitHub Release rather than a version error, which is what made it
        # survive a real release (indicate v0.8.0).
        #
        # uv reads `requires-python` and downloads a matching interpreter if
        # the runner has none (`python-downloads` defaults to `automatic`), so
        # there is nothing left for this input to get wrong.
        description: 'Pin the pre-release test run to one Python version (default: whatever satisfies requires-python)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    if: inputs.run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # setup-uv's `python-version` input only sets UV_PYTHON, and its handling
      # of an empty string is undocumented -- so set the variable directly, and
      # only when a caller actually asked for a pin.
      - name: Pin the interpreter, if the caller asked for one
        if: inputs.test-python-version != ''
        env:
          PINNED: ${{ inputs.test-python-version }}
        run: echo "UV_PYTHON=$PINNED" >> "$GITHUB_ENV"
      # Same sync as reusable-ci's test job, so a release runs what CI runs.
      - name: Use the package's minimum Python
        # uv uses the runner's own Python (3.12) only when it satisfies
        # requires-python; otherwise it downloads the newest release, which can be
        # newer than a dependency's wheels (torch had none for 3.15 when 3.15
        # shipped). The test matrix names its versions; this pins the jobs that
        # do not to the lowest minor version requires-python allows, intersected
        # with the requires-python of each group the job installs: FLOOR_GROUPS,
        # plus the repo's default groups where a uv sync or uv run adds them.
        # A UV_PYTHON the caller set, or the repo's .python-version, is left alone.
        env:
          FLOOR_GROUPS: "dev test"
          FLOOR_DEFAULTS: "true"
        run: |
          if [ -n "${UV_PYTHON:-}" ] || [ -f .python-version ]; then
            echo "keeping the interpreter already chosen"
            exit 0
          fi
          request=$(uv run --no-project --python '>=3.11' --with packaging==26.3 \
            python - <<'PY'
          import os
          import tomllib

          from packaging.specifiers import SpecifierSet
          from packaging.utils import canonicalize_name as canon

          try:
              with open("pyproject.toml", "rb") as handle:
                  data = tomllib.load(handle)
          except FileNotFoundError:
              data = {}
          specs = [data.get("project", {}).get("requires-python", "")]
          uv_table = data.get("tool", {}).get("uv", {})
          # Group names compare normalized, as the dependency-groups spec says.
          groups = {canon(k): v for k, v in uv_table.get("dependency-groups", {}).items()}
          names = {canon(g) for g in os.environ.get("FLOOR_GROUPS", "").split()}
          # Jobs whose uv sync or bare uv run also installs the default groups.
          if os.environ.get("FLOOR_DEFAULTS") == "true":
              defaults = uv_table.get("default-groups", ["dev"])
              names |= set(groups) if defaults == "all" else {canon(g) for g in defaults}
          for name in sorted(names):
              specs.append(groups.get(name, {}).get("requires-python", ""))
          spec = SpecifierSet(",".join(s for s in specs if s))
          if str(spec):
              for minor in range(8, 100):
                  if any(spec.contains(f"3.{minor}.{patch}") for patch in range(1000)):
                      print(f"==3.{minor}.*,{spec}")
                      break
              else:
                  print(f"!{spec}")  # nothing satisfies it; the shell warns
          PY
          )
          if [ "${request#!}" != "$request" ]; then
            echo "::warning::no Python 3.x satisfies ${request#!}"
            request=""
          fi
          if [ -n "$request" ]; then
            echo "UV_PYTHON=$request" >> "$GITHUB_ENV"
          fi
          echo "interpreter request: ${request:-none}"
      - name: Sync environment
        run: |
          test_group=()
          if python -c 'import sys, tomllib; sys.exit("test" not in tomllib.load(open("pyproject.toml", "rb")).get("dependency-groups", {}))'; then
            test_group=(--group test)
          fi
          if [ -f uv.lock ]; then
            uv sync --no-default-groups --frozen --group dev "${test_group[@]}" --all-extras
          else
            uv sync --no-default-groups --group dev "${test_group[@]}" --all-extras
          fi
      # A release is the one action that cannot be taken back, so the log says
      # which interpreter the suite actually ran on rather than leaving it to
      # be inferred from the runner image.
      - name: Report the resolved interpreter
        run: uv run python -VV
      - name: Run tests
        run: uv run pytest

  build:
    needs: test
    # `needs` on a job that can be skipped would skip this one too, so state
    # the condition rather than inheriting it: build whenever the tests either
    # passed or were deliberately not run.
    if: >-
      !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # remove after the existing dynamic-version repos migrate
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Use the package's minimum Python
        # uv uses the runner's own Python (3.12) only when it satisfies
        # requires-python; otherwise it downloads the newest release, which can be
        # newer than a dependency's wheels (torch had none for 3.15 when 3.15
        # shipped). The test matrix names its versions; this pins the jobs that
        # do not to the lowest minor version requires-python allows, intersected
        # with the requires-python of each group the job installs: FLOOR_GROUPS,
        # plus the repo's default groups where a uv sync or uv run adds them.
        # A UV_PYTHON the caller set, or the repo's .python-version, is left alone.
        env:
          FLOOR_GROUPS: ""
          FLOOR_DEFAULTS: "false"
        run: |
          if [ -n "${UV_PYTHON:-}" ] || [ -f .python-version ]; then
            echo "keeping the interpreter already chosen"
            exit 0
          fi
          request=$(uv run --no-project --python '>=3.11' --with packaging==26.3 \
            python - <<'PY'
          import os
          import tomllib

          from packaging.specifiers import SpecifierSet
          from packaging.utils import canonicalize_name as canon

          try:
              with open("pyproject.toml", "rb") as handle:
                  data = tomllib.load(handle)
          except FileNotFoundError:
              data = {}
          specs = [data.get("project", {}).get("requires-python", "")]
          uv_table = data.get("tool", {}).get("uv", {})
          # Group names compare normalized, as the dependency-groups spec says.
          groups = {canon(k): v for k, v in uv_table.get("dependency-groups", {}).items()}
          names = {canon(g) for g in os.environ.get("FLOOR_GROUPS", "").split()}
          # Jobs whose uv sync or bare uv run also installs the default groups.
          if os.environ.get("FLOOR_DEFAULTS") == "true":
              defaults = uv_table.get("default-groups", ["dev"])
              names |= set(groups) if defaults == "all" else {canon(g) for g in defaults}
          for name in sorted(names):
              specs.append(groups.get(name, {}).get("requires-python", ""))
          spec = SpecifierSet(",".join(s for s in specs if s))
          if str(spec):
              for minor in range(8, 100):
                  if any(spec.contains(f"3.{minor}.{patch}") for patch in range(1000)):
                      print(f"==3.{minor}.*,{spec}")
                      break
              else:
                  print(f"!{spec}")  # nothing satisfies it; the shell warns
          PY
          )
          if [ "${request#!}" != "$request" ]; then
            echo "::warning::no Python 3.x satisfies ${request#!}"
            request=""
          fi
          if [ -n "$request" ]; then
            echo "UV_PYTHON=$request" >> "$GITHUB_ENV"
          fi
          echo "interpreter request: ${request:-none}"
      - name: Build distributions
        run: uv build
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built_version=$(unzip -p dist/*.whl '*/METADATA' | sed -n 's/^Version: //p')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$built_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match built version $built_version"
            exit 1
          fi
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    if: inputs.publish-pypi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.testpypi && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write  # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          # Matches the template's publish step. This path is reachable only via
          # publish-pypi: true, which defaults false because trusted publishing
          # cannot bind its OIDC claims to a reusable workflow -- but leaving the
          # two publish steps saying different things is exactly how their action
          # pins came to be two months apart.
          skip-existing: true
          repository-url: ${{ inputs.testpypi && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    if: >-
      !cancelled() && inputs.github-release && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
