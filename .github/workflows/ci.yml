name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: catch ecosystem drift on a quiet repo

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      wheel-import: py_canon
      # The repo that defines the standard gates on it. `run-preen` defaults to
      # false, so opting in here is what makes the README's conformance claim
      # true of at least the repo making the claim.
      run-preen: true

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflow files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticated, and checked. Unauthenticated api.github.com is rate
          # limited per runner IP, so this call returned a rate-limit body
          # instead of a release, python raised KeyError: 'assets', and the
          # empty URL was piped into tar -- which failed with "Error is not
          # recoverable" and buried the actual cause. The job had been red on
          # main for days, and because actionlint is a required context it was
          # holding armed Dependabot PRs at BLOCKED: #14 and #15 were both
          # waiting on it. A download that can fail silently must not be the
          # thing a required check depends on.
          url=$(gh api repos/rhysd/actionlint/releases/latest \
            --jq '.assets[] | select(.name | test("linux_amd64\\.tar\\.gz$")) | .browser_download_url')
          if [ -z "$url" ]; then
            echo "::error::could not resolve an actionlint release asset"
            exit 1
          fi
          curl -sSfL "$url" | tar xz actionlint
          ./actionlint .github/workflows/*.yml template/.github/workflows/*.yml

  template-smoke:
    name: Template consumer smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Generate project from template
        run: |
          # --vcs-ref=HEAD is load-bearing: copier defaults to the latest *tag*
          # of a git template, and this repo's fleet-facing `v1` is a tag. It
          # happens to work without the flag only because actions/checkout does
          # a depth-1 fetch that carries no tags, so copier falls back to HEAD.
          # Anyone adding fetch-depth: 0 to this job would silently turn the
          # smoke test into a test of the last release instead of this change.
          uvx copier copy --trust --vcs-ref=HEAD . /tmp/smoke-pkg \
            -d project_name=smoke-pkg -d description="Smoke test package" \
            -d package_name=smoke_core -d needs_cli=true --defaults
      - name: Run the full gate on the generated project
        run: |
          cd /tmp/smoke-pkg
          # docs group references py-canon@v1 on GitHub; for the smoke test,
          # point it at the local checkout being tested instead
          sed -i "s|py-canon @ git+https://github.com/gojiplus/py-canon@v1|py-canon @ file://$GITHUB_WORKSPACE|" pyproject.toml
          grep -F 'build-backend = "uv_build"' pyproject.toml
          grep -F 'module-name = "smoke_core"' pyproject.toml
          if grep -Eq 'hatchling|uv-dynamic-versioning' pyproject.toml; then
            echo "::error::generated project contains a legacy build backend"
            exit 1
          fi
          uv sync --all-groups
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uvx --from pydoclint==0.9.1 pydoclint src/
          uv run pytest -q
          uv build
          uv run python -c "import smoke_core; assert smoke_core.__version__ == '0.1.0'"
          uv run sphinx-build -W -q -b html docs _site
          # The template's whole job is to produce a repo that meets the
          # standard, so assert exactly that rather than trusting it. Without
          # this line the template drifted from the standard it distributes:
          # it shipped the deprecated `license = { text = "MIT" }` form and no
          # CHANGELOG, so every generated repo was born failing conformance.
          #
          # Two checks are skipped because they fail on facts about *this
          # throwaway project*, not about the template. `links` 404s on
          # github.com/gojiplus/smoke-pkg, a repo that will never exist.
          # `template` reports drift because the project is generated from an
          # unreleased commit, so its recorded _commit is ahead of the latest
          # tag. The other sixteen checks gate.
          uvx preen check --strict --skip links --skip template
          echo "template smoke test: full gate green"

  promote:
    name: Promote v1
    # v1 is the fleet-facing moving tag; it only ever advances to a commit
    # every CI job just validated. Rollback: push -f <sha>:refs/tags/v1
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ci, actionlint, template-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fast-forward v1
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin v1
