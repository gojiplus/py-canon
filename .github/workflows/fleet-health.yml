name: Fleet health

# Daily scan of the fleet's workflows and branches. Failures are
# root-caused and aggregated into a single pinned issue on this repo, so red
# repos are discovered centrally and triaged once rather than per visit.
#
# The scan logic lives in `py_canon.fleet_triage`, not inline here: it is
# classification with rules worth unit-testing, and this repo has already been
# bitten twice (#8, #26) by workflow logic nobody could run locally.

on:
  schedule:
    - cron: "42 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Triage the fleet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m py_canon.fleet_triage \
            --fleet FLEET --fleet FLEET_HEALTH \
            --issue-repo "$GITHUB_REPOSITORY"
