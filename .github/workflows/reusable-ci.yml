name: Reusable CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test'
        type: string
        default: '["3.11", "3.14"]'
      os:
        description: 'JSON array of runner images for the test matrix'
        type: string
        default: '["ubuntu-latest"]'
      coverage-floor:
        description: 'Fail tests below this coverage percent (0 disables)'
        type: number
        default: 0
      run-pydoclint:
        description: 'Run pydoclint in the lint job'
        type: boolean
        default: true
      run-preen:
        description: 'Run preen check --strict in the lint job'
        type: boolean
        default: false
      wheel-import:
        description: 'Import name to smoke-test from the built wheel (defaults to repo package auto-detect)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync environment
        run: |
          if [ -f uv.lock ]; then uv sync --frozen --all-groups --all-extras; else uv sync --all-groups --all-extras; fi
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pydoclint
        if: inputs.run-pydoclint
        run: |
          set -euo pipefail
          # A bare `-d src` test silently exempted every flat-layout repo --
          # six of them, at last count -- and a check that prints "skipping"
          # and exits 0 is indistinguishable from one that passed. So derive
          # the package directory the way preen's structure check does, from
          # the distribution name, allowing for the usual hyphen/underscore
          # swap (know-your-ip -> know_your_ip).
          if [ -d src ]; then
            uvx --from pydoclint==0.9.1 pydoclint src/
            exit 0
          fi
          # Matched on __init__.py rather than a bare directory test: a repo
          # can carry a data/ or docs/ directory sharing the project name.
          pkg=$(uv run python -c '
          import pathlib
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              name = tomllib.load(fh).get("project", {}).get("name", "")
          hit = next(
              (
                  c
                  for c in (name, name.replace("-", "_"))
                  if c and pathlib.Path(c, "__init__.py").is_file()
              ),
              "",
          )
          print(hit)
          ')
          if [ -z "$pkg" ]; then
            echo "::error::pydoclint found no package to check: there is no src/, and no directory matching the project name contains an __init__.py. Pass run-pydoclint: false if this repo genuinely has nothing for it to check."
            exit 1
          fi
          echo "pydoclint: flat layout, checking $pkg/"
          uvx --from pydoclint==0.9.1 pydoclint "$pkg"
      - name: Preen conformance
        if: inputs.run-preen
        run: uvx preen check --strict

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The only job that runs on the caller's matrix, so the only one that can
    # land on Windows, where the default shell is PowerShell and the POSIX
    # conditionals below fail to parse. Windows runners ship Git Bash, so
    # pinning the shell makes one script work on every runner.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync environment
        run: |
          if [ -f uv.lock ]; then uv sync --frozen --all-groups --all-extras; else uv sync --all-groups --all-extras; fi
      - name: Run tests
        env:
          COVERAGE_FLOOR: ${{ inputs.coverage-floor }}
        run: |
          if [ "$COVERAGE_FLOOR" != "0" ]; then
            uv run pytest --cov --cov-report=term-missing --cov-fail-under="$COVERAGE_FLOOR"
          else
            uv run pytest
          fi

      # Coverage belongs in the run you are already looking at, not in a file
      # on a runner that is about to be deleted. `--cov-report=html` wrote an
      # htmlcov/ nobody opened, and `=xml` a coverage.xml nothing uploaded --
      # four fleet repos were doing one or both, and no CI in any of them read
      # the result.
      #
      # `if: always()` because a failing suite is when the number is most worth
      # seeing. `|| true` because a missing .coverage file means coverage was
      # not enabled for this leg, which is not a failure.
      - name: Coverage summary
        if: always() && inputs.coverage-floor != 0
        run: |
          {
            echo "## Coverage"
            echo
            uv run coverage report --format=markdown || echo "_no coverage data_"
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

  wheel:
    name: Test built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # remove after the existing dynamic-version repos migrate
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Install wheel in clean env and test
        env:
          WHEEL_IMPORT: ${{ inputs.wheel-import }}
        run: |
          uv venv /tmp/wheelenv
          . /tmp/wheelenv/bin/activate
          uv pip install dist/*.whl
          uv pip install --group test . 2>/dev/null || uv pip install pytest
          import_name="$WHEEL_IMPORT"
          if [ -z "$import_name" ]; then
            import_name=$(basename src/*/ 2>/dev/null | head -1 | tr - _)
          fi
          python -c "import $import_name; print('import OK:', '$import_name')"
          if [ -d tests ]; then python -m pytest tests/ -q; fi

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Zizmor (Actions security lint)
        run: uvx zizmor --min-severity high .github/workflows/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # One stable context for rulesets to require, so the matrix can change
  # without silently orphaning a required check. Naming a matrix leg directly
  # in a ruleset is how naampy and outkast ended up requiring contexts that no
  # longer existed: every PR sat BLOCKED with no visible failure.
  # `if: always()` so a skipped or failed upstream job still reports here.
  gate:
    name: gate
    if: always()
    needs: [lint, test, wheel, workflow-security, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert no upstream job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          # 'skipped' is legitimate -- dependency-review only runs on PRs.
          printf '%s\n' "$RESULTS" \
            | jq -e 'all(.[].result; . == "success" or . == "skipped")'
