name: Reusable CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test'
        type: string
        default: '["3.12", "3.14"]'
      os:
        description: 'JSON array of runner images for the test matrix'
        type: string
        default: '["ubuntu-latest"]'
      coverage-floor:
        description: 'Fail tests below this coverage percent (0 disables)'
        type: number
        default: 0
      test-timeout-minutes:
        description: 'Maximum runtime for each test-matrix job'
        type: number
        default: 30
      run-pydoclint:
        description: 'Run pydoclint in the lint job'
        type: boolean
        default: true
      run-preen:
        description: 'Run preen check --strict in the lint job'
        type: boolean
        default: true
      run-wheel:
        description: 'Install the built wheel in a clean environment and run tests'
        type: boolean
        default: true
      wheel-timeout-minutes:
        description: 'Maximum runtime for the wheel build and test job'
        type: number
        default: 20
      wheel-import:
        description: 'Import name to smoke-test from the built wheel (defaults to repo package auto-detect)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync environment
        run: |
          test_group=()
          if python -c 'import sys, tomllib; sys.exit("test" not in tomllib.load(open("pyproject.toml", "rb")).get("dependency-groups", {}))'; then
            test_group=(--group test)
          fi
          if [ -f uv.lock ]; then
            uv sync --no-default-groups --frozen --group dev "${test_group[@]}" --all-extras
          else
            uv sync --no-default-groups --group dev "${test_group[@]}" --all-extras
          fi
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pydoclint
        if: inputs.run-pydoclint
        run: |
          set -euo pipefail
          # A bare `-d src` test silently exempted every flat-layout repo --
          # six of them, at last count -- and a check that prints "skipping"
          # and exits 0 is indistinguishable from one that passed. So derive
          # the package directory the way preen's structure check does, from
          # the distribution name, allowing for the usual hyphen/underscore
          # swap (know-your-ip -> know_your_ip).
          if [ -d src ]; then
            uvx --from pydoclint==0.9.1 pydoclint src/
            exit 0
          fi
          # Matched on __init__.py rather than a bare directory test: a repo
          # can carry a data/ or docs/ directory sharing the project name.
          # `module-name` first: it is how a repo declares an import name that
          # differs from its distribution name, and guessing from the
          # distribution name alone made this step hard-error on a conforming
          # repo. finite-sample/optimal-classification-cutoffs ships
          # `optimal_cutoffs/`, so the guess looked for
          # `optimal_classification_cutoffs/`, found nothing, and the adoption
          # had to pass run-pydoclint: false on a package that is clean.
          pkg=$(uv run python -c '
          import pathlib
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          name = data.get("project", {}).get("name", "")
          backend = data.get("tool", {}).get("uv", {}).get("build-backend", {})
          root = backend.get("module-root", "")
          declared = backend.get("module-name", "")
          candidates = [declared] if declared else [name, name.replace("-", "_")]
          hit = next(
              (
                  str(pathlib.Path(root, c)) if root else c
                  for c in candidates
                  if c and pathlib.Path(root, c, "__init__.py").is_file()
              ),
              "",
          )
          print(hit)
          ')
          if [ -z "$pkg" ]; then
            echo "::error::pydoclint found no package to check: there is no src/, and no directory matching the project name contains an __init__.py. Pass run-pydoclint: false if this repo genuinely has nothing for it to check."
            exit 1
          fi
          echo "pydoclint: flat layout, checking $pkg/"
          uvx --from pydoclint==0.9.1 pydoclint "$pkg"
      - name: Preen conformance
        if: inputs.run-preen
        # --skip tests: the test job below already runs the suite, across the
        # whole matrix and with coverage. Running it a second time here bought
        # nothing and cost the lint job its 15-minute budget on repos whose
        # suites are slow -- finite-sample/calibre's lint was cancelled at
        # 15m15s while pytest was still going.
        run: uvx preen check --strict --skip tests

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    # The only job that runs on the caller's matrix, so the only one that can
    # land on Windows, where the default shell is PowerShell and the POSIX
    # conditionals below fail to parse. Windows runners ship Git Bash, so
    # pinning the shell makes one script work on every runner.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync environment
        run: |
          test_group=()
          if python -c 'import sys, tomllib; sys.exit("test" not in tomllib.load(open("pyproject.toml", "rb")).get("dependency-groups", {}))'; then
            test_group=(--group test)
          fi
          if [ -f uv.lock ]; then
            uv sync --no-default-groups --frozen --group dev "${test_group[@]}" --all-extras
          else
            uv sync --no-default-groups --group dev "${test_group[@]}" --all-extras
          fi
      - name: Run tests
        env:
          COVERAGE_FLOOR: ${{ inputs.coverage-floor }}
        run: |
          if [ "$COVERAGE_FLOOR" != "0" ]; then
            uv run pytest --cov --cov-report=term-missing --cov-fail-under="$COVERAGE_FLOOR"
          else
            uv run pytest
          fi

      # Coverage belongs in the run you are already looking at, not in a file
      # on a runner that is about to be deleted. `--cov-report=html` wrote an
      # htmlcov/ nobody opened, and `=xml` a coverage.xml nothing uploaded --
      # four fleet repos were doing one or both, and no CI in any of them read
      # the result.
      #
      # `if: always()` because a failing suite is when the number is most worth
      # seeing. `|| true` because a missing .coverage file means coverage was
      # not enabled for this leg, which is not a failure.
      - name: Coverage summary
        if: always() && inputs.coverage-floor != 0
        run: |
          {
            echo "## Coverage"
            echo
            uv run coverage report --format=markdown || echo "_no coverage data_"
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

  wheel:
    name: Build and test wheel
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.wheel-timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # remove after the existing dynamic-version repos migrate
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Install wheel in clean env and test
        if: inputs.run-wheel
        env:
          WHEEL_IMPORT: ${{ inputs.wheel-import }}
        run: |
          uv venv /tmp/wheelenv
          . /tmp/wheelenv/bin/activate
          # Guarded the same way the sync steps above are: uv exits 2 with
          # "The dependency group 'test' was not found" on a repo that has not
          # split one out yet, which turns an unrelated packaging job red.
          test_group=()
          if python -c 'import sys, tomllib; sys.exit("test" not in tomllib.load(open("pyproject.toml", "rb")).get("dependency-groups", {}))'; then
            test_group=(--group test)
          fi
          uv pip install dist/*.whl "${test_group[@]}"
          # The branch below runs pytest inside this clean environment, so a
          # repo with tests but no test group still needs a runner in it.
          if [ ${#test_group[@]} -eq 0 ] && [ -d "$GITHUB_WORKSPACE/tests" ]; then
            uv pip install pytest
          fi
          import_name="$WHEEL_IMPORT"
          if [ -z "$import_name" ]; then
            import_name=$(basename src/*/ 2>/dev/null | head -1 | tr - _)
          fi
          if [ -d "$GITHUB_WORKSPACE/tests" ]; then
            python -P -c '
          import importlib
          import pathlib
          import pytest
          import sys

          class WheelImport:
              @staticmethod
              def pytest_configure(config):
                  module = importlib.import_module(sys.argv[1])
                  checkout = pathlib.Path(sys.argv[2]).resolve()
                  locations = []
                  if getattr(module, "__file__", None):
                      locations.append(pathlib.Path(module.__file__).resolve())
                  if getattr(module, "__path__", None):
                      locations.extend(pathlib.Path(path).resolve() for path in module.__path__)
                  if not locations:
                      raise pytest.UsageError(f"cannot determine import location for {sys.argv[1]}")
                  if any(location == checkout or checkout in location.parents for location in locations):
                      raise pytest.UsageError(f"{sys.argv[1]} imported from checkout instead of the wheel: {locations}")

          raise SystemExit(pytest.main(
              ["--import-mode=append", "-o", "pythonpath=", sys.argv[3], "-q"],
              plugins=[WheelImport()],
          ))
          ' "$import_name" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tests/"
          else
            python -P -c 'import importlib, sys; importlib.import_module(sys.argv[1])' "$import_name"
          fi

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Zizmor (Actions security lint)
        run: uvx zizmor --min-severity high .github/workflows/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # One stable context for rulesets to require, so the matrix can change
  # without silently orphaning a required check. Naming a matrix leg directly
  # in a ruleset is how naampy and outkast ended up requiring contexts that no
  # longer existed: every PR sat BLOCKED with no visible failure.
  # `if: always()` so a skipped or failed upstream job still reports here.
  gate:
    name: gate
    if: always()
    needs: [lint, test, wheel, workflow-security, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert no upstream job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          # 'skipped' is legitimate -- dependency-review only runs on PRs.
          printf '%s\n' "$RESULTS" \
            | jq -e 'all(.[].result; . == "success" or . == "skipped")'
