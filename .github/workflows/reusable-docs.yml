name: Reusable Docs

on:
  workflow_call:
    inputs:
      docs-dir:
        description: 'Sphinx source directory'
        type: string
        default: 'docs'
      deploy:
        description: 'Deploy to GitHub Pages (typically only on default-branch push)'
        type: boolean
        default: false
      run-doctests:
        description: 'Run sphinx doctest builder'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Use the package's minimum Python
        # uv uses the runner's own Python (3.12) only when it satisfies
        # requires-python; otherwise it downloads the newest release, which can be
        # newer than a dependency's wheels (torch had none for 3.15 when 3.15
        # shipped). The test matrix names its versions; this pins the jobs that
        # do not to the lowest minor version requires-python allows, intersected
        # with any dependency group's own requires-python. A UV_PYTHON the caller
        # set, or the repo's .python-version, is left alone.
        run: |
          if [ -n "${UV_PYTHON:-}" ] || [ -f .python-version ]; then
            echo "keeping the interpreter already chosen"
            exit 0
          fi
          request=$(uv run --no-project --with packaging python - <<'PY'
          import tomllib

          from packaging.specifiers import SpecifierSet

          try:
              with open("pyproject.toml", "rb") as handle:
                  data = tomllib.load(handle)
          except FileNotFoundError:
              data = {}
          specs = [data.get("project", {}).get("requires-python", "")]
          groups = data.get("tool", {}).get("uv", {}).get("dependency-groups", {})
          specs += [g.get("requires-python", "") for g in groups.values()]
          spec = SpecifierSet(",".join(s for s in specs if s))
          if str(spec):
              for minor in range(8, 40):
                  if any(spec.contains(f"3.{minor}.{patch}") for patch in range(100)):
                      print(f"==3.{minor}.*,{spec}")
                      break
          PY
          )
          if [ -n "$request" ]; then
            echo "UV_PYTHON=$request" >> "$GITHUB_ENV"
          fi
          echo "interpreter request: ${request:-none}"
      - name: Sync docs environment
        run: |
          if [ -f uv.lock ]; then uv sync --frozen --group docs; else uv sync --group docs; fi
      - name: Build HTML (warnings are errors)
        env:
          DOCS_DIR: ${{ inputs.docs-dir }}
        run: uv run sphinx-build -W -b html "$DOCS_DIR" _site
      - name: Doctests
        if: inputs.run-doctests
        env:
          DOCS_DIR: ${{ inputs.docs-dir }}
        run: uv run sphinx-build -b doctest "$DOCS_DIR" _doctest
      - name: Upload Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
