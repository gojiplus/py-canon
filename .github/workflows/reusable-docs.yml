name: Reusable Docs

on:
  workflow_call:
    inputs:
      docs-dir:
        description: 'Sphinx source directory'
        type: string
        default: 'docs'
      deploy:
        description: 'Deploy to GitHub Pages (typically only on default-branch push)'
        type: boolean
        default: false
      run-doctests:
        description: 'Run sphinx doctest builder'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Use the package's minimum Python
        # uv uses the runner's own Python (3.12) only when it satisfies
        # requires-python; otherwise it downloads the newest release, which can be
        # newer than a dependency's wheels (torch had none for 3.15 when 3.15
        # shipped). The test matrix names its versions; this pins the jobs that
        # do not, to the floor the package declares. A pin already set wins.
        run: |
          floor=$(python3 - <<'PY'
          import re
          import tomllib

          try:
              with open("pyproject.toml", "rb") as handle:
                  spec = tomllib.load(handle)["project"]["requires-python"]
          except (FileNotFoundError, KeyError):
              spec = ""
          match = re.search(r"(?:>=|~=|==)\s*(3\.\d+)", spec)
          print(match.group(1) if match else "")
          PY
          )
          if [ -n "$floor" ] && [ -z "${UV_PYTHON:-}" ]; then
            echo "UV_PYTHON=$floor" >> "$GITHUB_ENV"
          fi
          echo "requires-python floor: ${floor:-none}"
      - name: Sync docs environment
        run: |
          if [ -f uv.lock ]; then uv sync --frozen --group docs; else uv sync --group docs; fi
      - name: Build HTML (warnings are errors)
        env:
          DOCS_DIR: ${{ inputs.docs-dir }}
        run: uv run sphinx-build -W -b html "$DOCS_DIR" _site
      - name: Doctests
        if: inputs.run-doctests
        env:
          DOCS_DIR: ${{ inputs.docs-dir }}
        run: uv run sphinx-build -b doctest "$DOCS_DIR" _doctest
      - name: Upload Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
