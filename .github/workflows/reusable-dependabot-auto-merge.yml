# The fleet's Dependabot auto-merge, as a workflow rather than a file to copy.
#
# This lived in py-canon's copier template, so every repo held its own copy.
# Copies drift, and these did: a fix made in preen had to be carried by hand
# into py-canon, r-canon and rmcp, and until that happened rmcp sat on the
# original version with six Dependabot PRs stuck behind it, four of them
# mergeable and simply never armed. Referencing this means the next fix
# reaches every repo on its next run.
#
# Two entry points, one eligibility decision. The caller supplies both:
#
#   pull_request  decides eligibility once, records the verdict as a label, arms
#   schedule      re-arms anything GitHub silently disarmed since
#
# The scheduled half exists because of a measured failure. On appeler/pranaam
# PR #29 the workflow armed auto-merge at 17:27:11 and GitHub disabled it at
# 17:42:38, four seconds after a PR-triggered docs workflow finished with a
# skipped job. Nothing re-arms, `on: pull_request` never fires again, and the
# PR sits green and unmerged while every workflow run reports success. Nine
# PRs had accumulated that way. A sweep converges no matter what disarmed the
# PR, which a `workflow_run` trigger racing the disarm event would not.
#
# A called workflow inherits the caller's `github` context, so the event, the
# pull request and the repository all read through unchanged.

name: reusable-dependabot-auto-merge

on:
  workflow_call:
    inputs:
      stale-after-hours:
        description: >
          How long an eligible PR may stay unmerged before the sweep says so
          out loud. Silence is the failure mode this exists to fix, so a sweep
          that quietly does nothing must still leave a mark.
        required: false
        type: number
        default: 12
      eligible-label:
        description: >
          Label carrying the eligibility verdict from the pull_request half to
          the scheduled half. Dependabot metadata is only available in a
          pull_request context, and major-versus-minor is not recoverable from
          a branch name, so the decision is made once and read back later.
        required: false
        type: string
        default: automerge-eligible

# Granted per job rather than here: a workflow-level write grant applies to
# every job, which zizmor's excessive-permissions audit rejects once there is
# more than one.
permissions: {}

env:
  ELIGIBLE_LABEL: ${{ inputs.eligible-label }}
  STALE_AFTER_HOURS: ${{ inputs.stale-after-hours }}
  # Neither job checks out the repo, so gh has no git remote to infer from.
  # Steps that pass a PR URL resolve the repo from the argument; `gh label
  # create` takes no URL, so it fell back to git and exited 1 -- on every
  # eligible PR the fleet ever saw. Set once here rather than per step: the
  # next gh call added to either job is then correct by default.
  GH_REPO: ${{ github.repository }}

jobs:
  classify:
    name: Classify and arm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # arm auto-merge
      pull-requests: write   # label, comment
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Everything Dependabot opens is eligible. What decides whether it lands
      # is CI, in the sweep below: every check terminal, none failed.
      #
      # This used to exclude Python-ecosystem majors, on the reasoning that a
      # major is a declared breaking change and green tests are not proof.
      # True, and outweighed by two things about how this fleet works:
      #
      #   Releases are tag-driven. A merged major reaches `main`, not users.
      #   Nothing ships until someone pushes vX.Y.Z, so the blast radius is a
      #   branch that can be reverted rather than a PyPI release that cannot.
      #
      #   The backlog was the bigger risk. Measured across the fleet: 57 open
      #   Dependabot PRs, 37 of them green and simply never merged. in-rolls/
      #   indicate was carrying eight dependencies with published security
      #   fixes -- click, jupyter-server, jupyterlab, mistune, pillow,
      #   pygments, setuptools, soupsieve -- because nothing landed them.
      #
      # The security group is the sharpest case, and it was the one this got
      # wrong. `python-security` never matched `*minor-and-patch*`, and a
      # security fix is often a major, so the updates most worth landing fast
      # were the least likely to merge. Routine patch bumps sailed past them.
      #
      # An empty ecosystem still means metadata failed, and that is the one
      # case left open: it is not a decision, it is the absence of one.
      - name: Decide eligibility
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ -n "$ECOSYSTEM" ]; then
            eligible=true
          else
            eligible=false
          fi
          echo "ecosystem=$ECOSYSTEM group=$GROUP update-type=$UPDATE_TYPE eligible=$eligible"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      # The label is what makes the scheduled sweep possible without it having
      # to guess. Created with --force so the first run in a repo works.
      - name: Record the verdict on the PR
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$ELIGIBLE_LABEL" --force --color 0e8a16 \
            --description "Auto-merge policy says yes; the sweep may arm or land this"
          gh pr edit "$PR_URL" --add-label "$ELIGIBLE_LABEL"

      # No `gh pr review --approve`: it fails outright where the repo has
      # "Allow GitHub Actions to create and approve pull requests" off, which
      # aborted the step before the merge ever ran. Our rulesets require status
      # checks, not reviews, and GitHub's own documented example does not
      # approve either.
      # GitHub's auto-merge waits for *required* status checks and nothing
      # else. Where a repository requires none there is nothing to wait for, so
      # `--auto` merges on the spot -- green, red, or still running.
      #
      # Measured: finite-sample/alsgls#37 was armed here and merged four
      # minutes later carrying `FAILURE test (3.12)` and two cancelled legs. It
      # took a ruff 0.7 -> 0.16 bump onto main and left the branch failing
      # `ruff format --check` for hours. Nothing reported it, because a push
      # made with GITHUB_TOKEN does not trigger workflows, so no CI ran on the
      # merge commit either.
      #
      # So arm only where arming means something. Everywhere else the sweep
      # below does the merging, and it requires every check terminal and none
      # failed. Up to three hours slower, and correct.
      - name: Check whether anything is actually required
        id: required
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GH_REPO}/rulesets" --jq '.[].id' 2>/dev/null \
            | while read -r id; do
                gh api "repos/${GH_REPO}/rulesets/${id}" --jq \
                  '.rules[]? | select(.type=="required_status_checks")
                   | .parameters.required_status_checks[].context' 2>/dev/null
              done | sort -u > required.txt || true
          count=$(wc -l < required.txt | tr -d ' ')
          echo "required contexts: $(tr '\n' ' ' < required.txt)"
          if [ "$count" = "0" ]; then
            echo "::warning::no required status checks on this repository, so \
            GitHub auto-merge would merge regardless of CI. Leaving this PR to \
            the scheduled sweep, which waits for checks to finish and pass."
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for eligible updates
        if: steps.gate.outputs.eligible == 'true' && steps.required.outputs.count != '0'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          err=$(gh pr merge --auto --squash "$PR_URL" 2>&1) && { printf '%s\n' "$err"; exit 0; }
          status=$?
          printf '%s\n' "$err"
          # Separate "the tool is broken" from "GitHub said no", because the
          # rest of this step deliberately swallows the second. Without this a
          # missing or unauthenticated gh would fall through to the catch-all
          # below and report success, which is the failure mode this whole
          # change exists to remove -- just relocated.
          if [ "$status" -eq 127 ] || printf '%s' "$err" | grep -qiE "not logged into|authentication failed|gh: command not found"; then
            echo "::error::gh itself failed (exit ${status}). This is a malfunction, not a declined merge."
            exit 1
          fi
          # A merge GitHub declined is an outcome, not a malfunction, and this
          # step must never turn one into a failing check.
          #
          # It used to, and the result was a closed loop. onlinerake#5 bumped
          # codecov-action, which lives inside .github/workflows/tests.yml. The
          # PR was already passing, so GitHub refused to arm it -- nothing left
          # to wait for -- and `--auto` fell through to merging on the spot,
          # which GitHub also refused, because this token may not edit workflow
          # files. That is not configurable: `workflows` is not among the
          # permissions a workflow can request. The step did not recognise the
          # message, exited 1, and the red job became a check on the PR. The
          # sweep below then read that failure as a failing check and declined
          # to touch it. One run, stuck for good.
          #
          # Worth knowing before anyone "fixes" this by requesting a permission
          # that does not exist: *arming* a workflow-file PR is fine, because
          # GitHub performs that merge itself. Only merging directly is
          # refused. So these merge themselves whenever they are armed before
          # their checks finish, and need a person only when they were already
          # green by the time we looked.
          case "$err" in
            *"clean status"*|*"not mergeable"*|*"Auto merge is not allowed"*)
              echo "::warning::auto-merge not armable yet; the sweep will retry" ;;
            *"workflows"*"permission"*)
              echo "::warning::${PR_URL} edits a workflow file, which this token may not merge. Needs a human; nothing here is broken." ;;
            *)
              echo "::warning::merge declined, reason not recognised; leaving the PR open. Message above." ;;
          esac
          # Unconditional on purpose: everything reaching here is GitHub
          # declining, which is an outcome. Malfunctions were caught above.
          exit 0

      - name: Flag ineligible updates for manual review
        if: steps.gate.outputs.eligible != 'true' && github.event.action == 'opened'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Left open for manual review — Dependabot metadata could not be read for this PR, so no eligibility decision was made. That is the absence of a decision rather than a refusal; everything with readable metadata is eligible and lands once CI is green."

  sweep:
    name: Re-arm stranded PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # arm auto-merge, or squash-merge outright
      pull-requests: write   # read labels, merge
    if: github.event_name != 'pull_request'
    steps:
      - name: Collect open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --author "app/dependabot" --state open --limit 100 \
            --json number,url,title,labels,autoMergeRequest,mergeStateStatus,statusCheckRollup,createdAt \
            > prs.json
          python3 -c "import json;print('collected',len(json.load(open('prs.json'))),'open Dependabot PRs')"

          # Required contexts, so a check that never reported can be named. A
          # green rollup is not the same as a satisfied ruleset: on
          # appeler/pranaam#10 all seven reported checks passed while the
          # required `build` context never ran at all -- its workflow had been
          # cancelled by a concurrency collision -- and the PR sat BLOCKED for
          # weeks looking entirely green. Counting reported checks cannot see
          # that; comparing against the requirement can.
          gh api "repos/${GH_REPO}/rulesets" --jq '.[].id' 2>/dev/null \
            | while read -r id; do
                gh api "repos/${GH_REPO}/rulesets/${id}" --jq \
                  '.rules[]? | select(.type=="required_status_checks")
                   | .parameters.required_status_checks[].context' 2>/dev/null
              done | sort -u > required.txt || true
          echo "required contexts: $(tr '\n' ' ' < required.txt)"

      # Decide per PR, print one line for every one of them, and act. Check
      # state is read from statusCheckRollup rather than from mergeStateStatus
      # alone: CLEAN is GitHub's opinion about mergeability, and this job needs
      # the stronger fact that every check has reached a terminal state and
      # none of them failed before it will merge anything directly.
      - name: Decide what to do with each
        id: plan
        run: |
          python3 - <<'PY' > actions.txt
          import json, os, datetime as dt

          TERMINAL_OK = {"SUCCESS", "SKIPPED", "NEUTRAL"}
          label = os.environ["ELIGIBLE_LABEL"]
          stale_after = dt.timedelta(hours=float(os.environ["STALE_AFTER_HOURS"]))
          now = dt.datetime.now(dt.UTC)

          def check_state(pr):
              """Terminal-and-green, still-running, or failing."""
              rollup = pr.get("statusCheckRollup") or []
              if not rollup:
                  return "no-checks"
              states = []
              for c in rollup:
                  # CheckRun reports status/conclusion; StatusContext reports state.
                  if c.get("__typename") == "StatusContext" or "state" in c:
                      states.append(c.get("state") or "PENDING")
                  elif (c.get("status") or "").upper() != "COMPLETED":
                      states.append("PENDING")
                  else:
                      states.append((c.get("conclusion") or "PENDING").upper())
              if any(s == "PENDING" for s in states):
                  return "running"
              return "green" if all(s in TERMINAL_OK for s in states) else "failing"

          def never_reported(pr):
              """Required contexts with no check run at all on this PR."""
              seen = {c.get("name") or c.get("context") for c in
                      (pr.get("statusCheckRollup") or [])}
              return sorted(required - seen)

          try:
              required = {ln.strip() for ln in open("required.txt") if ln.strip()}
          except OSError:
              required = set()

          for pr in json.load(open("prs.json")):
              n = pr["number"]
              names = {l["name"] for l in pr.get("labels") or []}
              age = now - dt.datetime.fromisoformat(pr["createdAt"].replace("Z", "+00:00"))
              if label not in names:
                  verdict, act = "ineligible (no policy label)", "none"
              elif pr.get("autoMergeRequest"):
                  verdict, act = "already armed", "none"
              elif pr["mergeStateStatus"] in {"DIRTY", "DRAFT"}:
                  # A conflict or a draft is unmergeable for everyone, and no
                  # amount of asking changes that.
                  verdict, act = f"not mergeable ({pr['mergeStateStatus']})", "none"
              else:
                  # Everything else -- CLEAN and BLOCKED alike -- is decided by
                  # the checks, not by mergeStateStatus.
                  #
                  # BLOCKED used to end the decision here. It should not:
                  # GitHub computes it for the *viewer*, and GITHUB_TOKEN
                  # cannot bypass a ruleset, so a PR a maintainer sees as CLEAN
                  # reads BLOCKED to this job. Treating that as final made the
                  # merge path unreachable in any repo whose ruleset the token
                  # cannot bypass: the sweep could arm, but never land.
                  # Measured on finite-sample/rmcp, where #63 and #58 had all
                  # three required contexts green, this step reported "not
                  # mergeable (BLOCKED)" on two consecutive runs, and both
                  # merged instantly when simply asked.
                  #
                  # What is worth checking is whether a required context never
                  # reported at all -- "BLOCKED" otherwise sends a reader
                  # looking for a failing check that does not exist. Past that,
                  # ask GitHub and let it refuse: it is the authority on its
                  # own rules, a refusal costs one API call, and the arm-or-land
                  # step already downgrades a refusal to a warning.
                  absent = never_reported(pr)
                  if absent:
                      verdict, act = (
                          f"not mergeable (required never ran: {','.join(absent)})",
                          "none",
                      )
                  else:
                      state = check_state(pr)
                      blocked = pr["mergeStateStatus"] == "BLOCKED"
                      verdict, act = {
                          "green": ("checks terminal and green", "merge"),
                          "running": ("checks still running", "arm"),
                          "failing": ("checks failing", "none"),
                          "no-checks": ("no checks reported", "none"),
                      }[state]
                      if blocked and act != "none":
                          verdict += " (BLOCKED for this token; asking anyway)"
              # Only shout when the sweep is unable to act. A PR being merged
              # on this very run is not stranded, however old it is.
              stale = act == "none" and label in names and age > stale_after
              print(f"{n}\t{act}\t{verdict}\t{int(age.total_seconds()//3600)}h\t{int(stale)}")
          PY
          printf '%-6s %-6s %-32s %6s\n' "PR" "ACTION" "VERDICT" "AGE"
          while IFS=$'\t' read -r n act verdict age stale; do
            printf '%-6s %-6s %-32s %6s\n' "#$n" "$act" "$verdict" "$age"
            if [ "$stale" = "1" ]; then
              echo "::warning::PR #$n is eligible but still unmerged after ${age} — automation has not been able to land it"
            fi
          done < actions.txt

      - name: Arm or land
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same rule as the classify job: a declined merge is reported, never
          # raised. These were already non-fatal; what they lacked was a reason.
          # "could not merge #5" reads as a broken sweep, when the actual state
          # is a PR that no token of ours can merge and a person must.
          explain() {
            case "$2" in
              *"workflows"*"permission"*)
                echo "::warning::#$1 edits a workflow file, which this token may not merge. Needs a human; the sweep is working." ;;
              *)
                echo "::warning::could not $3 #$1: $2" ;;
            esac
          }
          acted=0
          while IFS=$'\t' read -r n act _rest; do
            case "$act" in
              arm)
                echo "arming #$n"
                out=$(gh pr merge "$n" --auto --squash 2>&1) || explain "$n" "$out" arm
                acted=$((acted + 1)) ;;
              merge)
                echo "merging #$n"
                out=$(gh pr merge "$n" --squash --delete-branch 2>&1) || explain "$n" "$out" merge
                acted=$((acted + 1)) ;;
            esac
          done < actions.txt
          echo "sweep acted on $acted PR(s)"
