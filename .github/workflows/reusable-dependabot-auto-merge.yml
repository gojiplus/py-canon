# The fleet's Dependabot auto-merge, as a workflow rather than a file to copy.
#
# This lived in py-canon's copier template, so every repo held its own copy.
# Copies drift, and these did: a fix made in preen had to be carried by hand
# into py-canon, r-canon and rmcp, and until that happened rmcp sat on the
# original version with six Dependabot PRs stuck behind it, four of them
# mergeable and simply never armed. Referencing this means the next fix
# reaches every repo on its next run.
#
# Two entry points. The caller supplies both:
#
#   pull_request  arms auto-merge on a new Dependabot PR, where arming means
#                 something -- see the required-checks note below
#   schedule      merges anything green that is still open, whatever disarmed
#                 it, and whether or not this workflow existed when it opened
#
# The scheduled half exists because of a measured failure. On appeler/pranaam
# PR #29 the workflow armed auto-merge at 17:27:11 and GitHub disabled it at
# 17:42:38, four seconds after a PR-triggered docs workflow finished with a
# skipped job. Nothing re-arms, `on: pull_request` never fires again, and the
# PR sits green and unmerged while every workflow run reports success. Nine
# PRs had accumulated that way. A sweep converges no matter what disarmed the
# PR, which a `workflow_run` trigger racing the disarm event would not.
#
# A called workflow inherits the caller's `github` context, so the event, the
# pull request and the repository all read through unchanged.

name: reusable-dependabot-auto-merge

on:
  workflow_call:
    inputs:
      stale-after-hours:
        description: >
          How long an eligible PR may stay unmerged before the sweep says so
          out loud. Silence is the failure mode this exists to fix, so a sweep
          that quietly does nothing must still leave a mark.
        required: false
        type: number
        default: 12
    secrets:
      DEPENDABOT_REBASE_TOKEN:
        description: >
          A token of a user with push access, used only to post
          `@dependabot rebase`. Dependabot refuses commands from
          github-actions[bot] and from GitHub Apps ("only users with push
          access can use that command"), so GITHUB_TOKEN cannot do this.
          Without it the sweep labels and reports stale PRs instead.
        required: false

# The sweep inherits the caller's token permissions. Callers grant contents and
# pull-requests write, plus checks and statuses read. Inheritance lets callers
# add read permissions before this shared workflow rolls out.

env:
  STALE_AFTER_HOURS: ${{ inputs.stale-after-hours }}
  # Neither job checks out the repo, so gh has no git remote to infer from.
  # Steps that pass a PR URL resolve the repo from the argument; `gh label
  # create` takes no URL, so it fell back to git and exited 1 -- on every
  # eligible PR the fleet ever saw. Set once here rather than per step: the
  # next gh call added to either job is then correct by default.
  GH_REPO: ${{ github.repository }}

jobs:
  classify:
    name: Classify and arm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # arm auto-merge
      pull-requests: write   # label, comment
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Everything Dependabot opens is eligible. What decides whether it lands
      # is CI, in the sweep below: every check terminal, none failed.
      #
      # This used to exclude Python-ecosystem majors, on the reasoning that a
      # major is a declared breaking change and green tests are not proof.
      # True, and outweighed by two things about how this fleet works:
      #
      #   Releases are tag-driven. A merged major reaches `main`, not users.
      #   Nothing ships until someone pushes vX.Y.Z, so the blast radius is a
      #   branch that can be reverted rather than a PyPI release that cannot.
      #
      #   The backlog was the bigger risk. Measured across the fleet: 57 open
      #   Dependabot PRs, 37 of them green and simply never merged. in-rolls/
      #   indicate was carrying eight dependencies with published security
      #   fixes -- click, jupyter-server, jupyterlab, mistune, pillow,
      #   pygments, setuptools, soupsieve -- because nothing landed them.
      #
      # The security group is the sharpest case, and it was the one this got
      # wrong. `python-security` never matched `*minor-and-patch*`, and a
      # security fix is often a major, so the updates most worth landing fast
      # were the least likely to merge. Routine patch bumps sailed past them.
      #
      # An empty ecosystem still means metadata failed, and that is the one
      # case left open: it is not a decision, it is the absence of one.
      - name: Decide eligibility
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ -n "$ECOSYSTEM" ]; then
            eligible=true
          else
            eligible=false
          fi
          echo "ecosystem=$ECOSYSTEM group=$GROUP update-type=$UPDATE_TYPE eligible=$eligible"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      # No `gh pr review --approve`: it fails outright where the repo has
      # "Allow GitHub Actions to create and approve pull requests" off, which
      # aborted the step before the merge ever ran. Our rulesets require status
      # checks, not reviews, and GitHub's own documented example does not
      # approve either.
      # GitHub's auto-merge waits for *required* status checks and nothing
      # else. Where a repository requires none there is nothing to wait for, so
      # `--auto` merges on the spot -- green, red, or still running.
      #
      # Measured: finite-sample/alsgls#37 was armed here and merged four
      # minutes later carrying `FAILURE test (3.12)` and two canceled legs. It
      # took a ruff 0.7 -> 0.16 bump onto main and left the branch failing
      # `ruff format --check` for hours. Nothing reported it, because a push
      # made with GITHUB_TOKEN does not trigger workflows, so no CI ran on the
      # merge commit either.
      #
      # So arm only where arming means something. Everywhere else the sweep
      # below does the merging, and it requires every check terminal and none
      # failed. Up to three hours slower, and correct.
      - name: Check whether anything is actually required
        id: required
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api --paginate "repos/${GH_REPO}/rulesets" --jq '.[] | select(.enforcement == "active") | .id' > ruleset-ids.txt 2> ruleset-error.txt; then
            if grep -Fq 'Upgrade to GitHub Pro or make this repository public' ruleset-error.txt; then
              echo "::notice::Rulesets are unavailable on this repository's plan; only the all-checks sweep may merge."
              : > ruleset-ids.txt
            else
              cat ruleset-error.txt >&2
              exit 1
            fi
          fi
          while read -r id; do
                gh api "repos/${GH_REPO}/rulesets/${id}" --jq \
                  '.rules[]? | select(.type=="required_status_checks")
                   | .parameters.required_status_checks[].context'
          done < ruleset-ids.txt | sort -u > required.txt
          count=$(wc -l < required.txt | tr -d ' ')
          echo "required contexts: $(tr '\n' ' ' < required.txt)"
          if [ "$count" = "0" ]; then
            echo "::warning::no required status checks on this repository, so \
            GitHub auto-merge would merge regardless of CI. Leaving this PR to \
            the scheduled sweep, which waits for checks to finish and pass."
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for eligible updates
        if: steps.gate.outputs.eligible == 'true' && steps.required.outputs.count != '0'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          err=$(gh pr merge --auto --squash "$PR_URL" 2>&1) && { printf '%s\n' "$err"; exit 0; }
          status=$?
          printf '%s\n' "$err"
          # Separate "the tool is broken" from "GitHub said no", because the
          # rest of this step deliberately swallows the second. Without this a
          # missing or unauthenticated gh would fall through to the catch-all
          # below and report success, which is the failure mode this whole
          # change exists to remove -- just relocated.
          if [ "$status" -eq 127 ] || printf '%s' "$err" | grep -qiE "not logged into|authentication failed|gh: command not found"; then
            echo "::error::gh itself failed (exit ${status}). This is a malfunction, not a declined merge."
            exit 1
          fi
          # A merge GitHub declined is an outcome, not a malfunction, and this
          # step must never turn one into a failing check.
          #
          # It used to, and the result was a closed loop. onlinerake#5 bumped
          # codecov-action, which lives inside .github/workflows/tests.yml. The
          # PR was already passing, so GitHub refused to arm it -- nothing left
          # to wait for -- and `--auto` fell through to merging on the spot,
          # which GitHub also refused, because this token may not edit workflow
          # files. That is not configurable: `workflows` is not among the
          # permissions a workflow can request. The step did not recognize the
          # message, exited 1, and the red job became a check on the PR. The
          # sweep below then read that failure as a failing check and declined
          # to touch it. One run, stuck for good.
          #
          # Worth knowing before anyone "fixes" this by requesting a permission
          # that does not exist: *arming* a workflow-file PR is fine, because
          # GitHub performs that merge itself. Only merging directly is
          # refused. So these merge themselves whenever they are armed before
          # their checks finish, and need a person only when they were already
          # green by the time we looked.
          case "$err" in
            *"clean status"*|*"not mergeable"*|*"Auto merge is not allowed"*)
              echo "::warning::auto-merge not armable yet; the sweep will retry" ;;
            *"workflows"*"permission"*)
              echo "::warning::${PR_URL} edits a workflow file, which this token may not merge. Needs a human; nothing here is broken." ;;
            *)
              echo "::error::unexpected merge failure: $err"; exit 1 ;;
          esac
          exit 0

      - name: Flag ineligible updates for manual review
        if: steps.gate.outputs.eligible != 'true' && github.event.action == 'opened'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Left open for manual review — Dependabot metadata could not be read for this PR, so no eligibility decision was made. That is the absence of a decision rather than a refusal; everything with readable metadata is eligible and lands once CI is green."

  sweep:
    name: Re-arm stranded PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - name: Collect open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --author "app/dependabot" --state open --limit 100 \
            --json number,url,title,labels,autoMergeRequest,mergeStateStatus,statusCheckRollup,createdAt \
            > prs.json
          python3 -c "import json;print('collected',len(json.load(open('prs.json'))),'open Dependabot PRs')"

          # Required contexts, so a check that never reported can be named. A
          # green rollup is not the same as a satisfied ruleset: on
          # appeler/pranaam#10 all seven reported checks passed while the
          # required `build` context never ran at all -- its workflow had been
          # canceled by a concurrency collision -- and the PR sat BLOCKED for
          # weeks looking entirely green. Counting reported checks cannot see
          # that; comparing against the requirement can.
          if ! gh api --paginate "repos/${GH_REPO}/rulesets" --jq '.[] | select(.enforcement == "active") | .id' > ruleset-ids.txt 2> ruleset-error.txt; then
            if grep -Fq 'Upgrade to GitHub Pro or make this repository public' ruleset-error.txt; then
              echo "::notice::Rulesets are unavailable on this repository's plan; only the all-checks sweep may merge."
              : > ruleset-ids.txt
            else
              cat ruleset-error.txt >&2
              exit 1
            fi
          fi
          while read -r id; do
                gh api "repos/${GH_REPO}/rulesets/${id}" --jq \
                  '.rules[]? | select(.type=="required_status_checks")
                   | .parameters.required_status_checks[].context'
          done < ruleset-ids.txt | sort -u > required.txt
          echo "required contexts: $(tr '\n' ' ' < required.txt)"

          # The default branch's head commit and its CI runs, so the plan can
          # tell a failure that predates a fix on main from a live one.
          # Dependabot rebases only on conflict. Measured on 2026-11-14: 16 of
          # 34 open fleet PRs failed nothing but a vulnerability audit that
          # their base branches had already fixed, with nothing to re-run them.
          gh api "repos/${GH_REPO}" --jq .default_branch > base-branch.txt
          gh api "repos/${GH_REPO}/commits/$(cat base-branch.txt)" > base-head.json
          sha=$(python3 -c 'import json; print(json.load(open("base-head.json"))["sha"])')
          # Best-effort: a caller that withholds actions: read gets this refused,
          # and the sweep then behaves exactly as it did before this lookup.
          if ! gh api "repos/${GH_REPO}/actions/runs?head_sha=${sha}&per_page=100" \
              > base-runs.json 2> base-runs-error.txt; then
            cat base-runs-error.txt >&2
            echo "::warning::could not list CI runs on $(cat base-branch.txt); \
          failures that predate a fix there will not be detected. Grant the \
          caller actions: read."
            echo '{"workflow_runs": [], "unavailable": true}' > base-runs.json
          fi

      # Decide per PR, print one line for every one of them, and act. Check
      # state is read from statusCheckRollup rather than from mergeStateStatus
      # alone: CLEAN is GitHub's opinion about mergeability, and this job needs
      # the stronger fact that every check has reached a terminal state and
      # none of them failed before it will merge anything directly.
      - name: Decide what to do with each
        id: plan
        run: |
          python3 - <<'PY' > actions.txt
          import json, os, datetime as dt

          TERMINAL_OK = {"SUCCESS", "SKIPPED", "NEUTRAL"}
          stale_after = dt.timedelta(hours=float(os.environ["STALE_AFTER_HOURS"]))
          now = dt.datetime.now(dt.UTC)

          def when(stamp):
              return dt.datetime.fromisoformat(stamp.replace("Z", "+00:00"))

          def result_of(check):
              if "state" in check:
                  return (check.get("state") or "PENDING").upper()
              if check.get("status") != "COMPLETED":
                  return "PENDING"
              return (check.get("conclusion") or "PENDING").upper()

          def is_failure(result):
              return result not in TERMINAL_OK | {"PENDING", "EXPECTED"}

          def check_results(pr):
              results = {}
              for check in pr.get("statusCheckRollup") or []:
                  name = check.get("name") or check.get("context") or "unnamed check"
                  results.setdefault(name, []).append(result_of(check))
              return results

          def predates_green_base(pr):
              # True when every failing check finished before the base branch's
              # head commit existed, and that commit's CI is green: the PR was
              # never tested against the fix, so its red is evidence of nothing.
              # A rebase that still fails has newer checks and stops qualifying,
              # so this cannot ask twice for the same base commit.
              if not base_green:
                  return False
              finished = [check.get("completedAt") or check.get("startedAt")
                          for check in pr.get("statusCheckRollup") or []
                          if is_failure(result_of(check))]
              return bool(finished) and all(
                  stamp and when(stamp) < base_since for stamp in finished)

          base_branch = open("base-branch.txt").read().strip()
          base_head = json.load(open("base-head.json"))
          base_since = when(base_head["commit"]["committer"]["date"])
          ci_runs = [run for run in json.load(open("base-runs.json"))["workflow_runs"]
                     if run.get("path") == ".github/workflows/ci.yml"]
          latest = max(ci_runs, key=lambda run: run["created_at"], default=None)
          base_green = bool(latest) and latest.get("status") == "completed" \
              and latest.get("conclusion") == "success"

          required = {line.strip() for line in open("required.txt") if line.strip()}
          summary = ["## Dependabot recovery", "", "| PR | Action | Status |",
                     "| --- | --- | --- |"]
          for pr in json.load(open("prs.json")):
              n = pr["number"]
              age = now - dt.datetime.fromisoformat(pr["createdAt"].replace("Z", "+00:00"))
              results = check_results(pr)
              missing = sorted(required - results.keys())
              failed = sorted(name for name, states in results.items()
                              if any(is_failure(state) for state in states))
              running = sorted(name for name, states in results.items()
                               if any(state in {"PENDING", "EXPECTED"} for state in states))
              blockers = []
              if pr["mergeStateStatus"] in {"DIRTY", "DRAFT"}:
                  blockers.append(f"not mergeable ({pr['mergeStateStatus']})")
              if missing:
                  blockers.append("required checks missing: " + ", ".join(missing))
              if failed:
                  blockers.append("checks failing: " + ", ".join(failed))
              if not results:
                  blockers.append("no checks reported")
              armed = bool(pr.get("autoMergeRequest"))
              labeled = int(any(label.get("name") == "needs-rebase"
                                for label in pr.get("labels") or []))
              if blockers:
                  verdict, act = "; ".join(blockers), "none"
                  if (failed and pr["mergeStateStatus"] not in {"DIRTY", "DRAFT"}
                          and predates_green_base(pr)):
                      act = "rebase"
                      verdict += (f"; every failure predates green {base_branch} "
                                  f"{base_head['sha'][:7]}")
              elif running:
                  verdict = "checks running: " + ", ".join(running)
                  act = "arm" if required and not armed else "none"
              else:
                  verdict = "checks terminal and green"
                  act = "none" if armed else "merge"
              if armed:
                  verdict += "; auto-merge enabled"
              stale = act == "none" and age > stale_after
              print(f"{n}\t{act}\t{verdict}\t{int(age.total_seconds()//3600)}h"
                    f"\t{int(stale)}\t{labeled}")
              safe_verdict = verdict.replace("|", "\\|").replace("\n", " ")
              summary.append(f"| [#{n}]({pr['url']}) | {act} | {safe_verdict} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("\n".join(summary) + "\n")
          PY
          printf '%-6s %-6s %-32s %6s\n' "PR" "ACTION" "VERDICT" "AGE"
          while IFS=$'\t' read -r n act verdict age stale _labeled; do
            printf '%-6s %-6s %-32s %6s\n' "#$n" "$act" "$verdict" "$age"
            if [ "$stale" = "1" ]; then
              echo "::warning::PR #$n remains open after ${age}: ${verdict}"
            fi
          done < actions.txt

      - name: Arm or land
        id: arm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBASE_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
        run: |
          # Same rule as the classify job: a declined merge is reported, never
          # raised. These were already non-fatal; what they lacked was a reason.
          # "could not merge #5" reads as a broken sweep, when the actual state
          # is a PR that no token of ours can merge and a person must.
          explain() {
            case "$2" in
              *"workflows"*"permission"*)
                echo "::warning::#$1 edits a workflow file, which this token may not merge. Needs a human; the sweep is working." ;;
              *"clean status"*|*"not mergeable"*|*"Auto merge is not allowed"*|*"base branch policy"*)
                echo "::warning::could not $3 #$1: $2" ;;
              *)
                echo "::error::could not $3 #$1: $2"; return 1 ;;
            esac
          }
          # The label is the record that this base commit has already been
          # asked about, so a sweep every three hours asks Dependabot once,
          # not eight times a day. Label calls warn rather than fail: the
          # warning below is the signal, and a sweep that dies over a label
          # would stop merging.
          labelled_once=0
          flag() {
            if [ "$labelled_once" = 0 ]; then
              gh label create needs-rebase --force --color FBCA04 \
                --description "Failed only before the base branch went green" \
                >/dev/null 2>&1 || echo "::warning::could not create the needs-rebase label"
              labelled_once=1
            fi
            gh pr edit "$1" --add-label needs-rebase >/dev/null 2>&1 \
              || echo "::warning::could not label #$1 needs-rebase"
          }
          acted=0
          merged=0
          while IFS=$'\t' read -r n act _verdict _age _stale labeled; do
            if [ "$labeled" = 1 ] && [ "$act" != rebase ]; then
              gh pr edit "$n" --remove-label needs-rebase >/dev/null 2>&1 \
                || echo "::warning::could not remove needs-rebase from #$n"
            fi
            case "$act" in
              rebase)
                if [ "$labeled" = 1 ]; then
                  echo "#$n was already flagged for this base; waiting on Dependabot"
                elif [ -n "${REBASE_TOKEN:-}" ]; then
                  if GH_TOKEN="$REBASE_TOKEN" gh pr comment "$n" --body "@dependabot rebase" >/dev/null 2>&1; then
                    echo "asked Dependabot to rebase #$n"
                    flag "$n"
                  else
                    echo "::warning::could not ask Dependabot to rebase #$n; check DEPENDABOT_REBASE_TOKEN"
                  fi
                else
                  flag "$n"
                fi
                if [ -z "${REBASE_TOKEN:-}" ]; then
                  echo "::warning::#$n failed only before $(cat base-branch.txt) went green. \
          Comment '@dependabot rebase' on it as a maintainer: Dependabot ignores \
          github-actions[bot]. Passing DEPENDABOT_REBASE_TOKEN automates this."
                fi
                acted=$((acted + 1)) ;;
              arm)
                echo "arming #$n"
                out=$(gh pr merge "$n" --auto --squash 2>&1) || explain "$n" "$out" arm
                acted=$((acted + 1)) ;;
              merge)
                echo "merging #$n"
                if out=$(gh pr merge "$n" --squash --delete-branch 2>&1); then
                  merged=$((merged + 1))
                else
                  explain "$n" "$out" merge
                fi
                acted=$((acted + 1)) ;;
            esac
          done < actions.txt
          echo "sweep acted on $acted PR(s), merged $merged"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger workflows -- GitHub
      # declines that deliberately, to stop a workflow re-triggering itself.
      # So a merge landed above leaves the default branch at a commit that no
      # CI run ever covered: the only evidence is the run on the PR branch,
      # which is then deleted.
      #
      # Measured on gojiplus/rowvoi: HEAD was `Bump twine from 6.2.0 to 7.0.0
      # (#4)`, merged 13:30, with zero workflow runs for its SHA; the passing
      # run belonged to `dependabot/uv/twine-7.0.0` at 12:37. fleet_triage
      # reads default-branch runs, so for auto-merge-heavy repos it reports on
      # an older commit than HEAD and can clear or flag the wrong thing.
      #
      # Dispatching is the one path a token-authored merge can still take. It
      # is best-effort: a repo whose ci.yml predates the `workflow_dispatch`
      # trigger simply cannot be dispatched, and saying so is more useful than
      # failing the sweep over it.
      #
      # Merges this sweep makes are not the only ones. Where a ruleset exists,
      # the classify job arms auto-merge and GitHub performs the merge as
      # github-actions[bot], which triggers nothing either: recite/softverse
      # main sat at `bump soupsieve (#58)`, merged that way on 2026-11-13, with
      # no CI run for days. So also dispatch when the default branch's head has
      # never been tested -- which is the evidence the stale-failure check above
      # needs before it will ask Dependabot to rebase anything.
      #
      # The branch name comes from the API: on a scheduled run the event
      # payload carries no repository object to read it from.
      - name: Run CI on the default branch if nothing else has
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED: ${{ steps.arm.outputs.merged }}
        run: |
          branch=$(cat base-branch.txt)
          untested=$(python3 -c 'import json
          runs = json.load(open("base-runs.json"))
          print(int(not runs.get("unavailable") and not any(
              run.get("path") == ".github/workflows/ci.yml" for run in runs["workflow_runs"])))')
          if [ "${MERGED:-0}" = 0 ] && [ "$untested" = 0 ]; then
            echo "$branch already has CI on its head commit"
            exit 0
          fi
          if out=$(gh workflow run ci.yml --ref "$branch" 2>&1); then
            echo "dispatched CI on $branch"
          else
            printf '%s\n' "$out"
            echo "::warning::could not dispatch CI on ${branch}; its head commit \
            will have no CI run of its own. If ci.yml has no workflow_dispatch \
            trigger, re-run 'preen adopt' to pick it up; a 403 means the caller \
            must grant actions: write."
          fi
